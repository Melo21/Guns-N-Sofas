<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strum Setlist</title>
<meta name="description" content="Guitar practice for people who know open chords: songs by level, play-along with real guitar sound, a TV chord highway, a tuner, and practice games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap" id="app"></div>
<div class="player" id="player" hidden>
  <div class="player-in">
    <div class="prow">
      <button class="play" id="playBtn" aria-label="Play">▶</button>
      <div class="now"><span class="c" id="nowC">G</span><span class="n" id="nextC">next: Em</span></div>
      <div class="bpm">
        <button id="bpmDown" aria-label="Slower">−</button>
        <output id="bpmOut">80</output>
        <button id="bpmUp" aria-label="Faster">+</button>
      </div>
      <button class="pvopen" id="pvOpenBtn" aria-label="Open big play view">⤢</button>
    </div>
    <div class="strum" id="strumRow"></div>
    <div class="toggles">
      <label><input type="checkbox" id="optStrum" checked> Guitar sound</label>
      <label><input type="checkbox" id="optClick" checked> Click</label>
      <span id="loopLabel">Looping: whole song</span>
    </div>
  </div>
</div>
<div class="pv" id="pv" hidden role="dialog" aria-label="Play-along view">
  <div class="pv-top"><button class="pv-x" id="pvExit">✕ Exit</button><div class="pv-title"><b id="pvSong"></b><span id="pvSec"></span></div><button class="pv-x" data-themebtn>◐ Auto</button></div>
  <div class="pv-main">
    <div class="pv-now"><span class="pv-label" id="pvLabel">Tap play</span><span class="pv-chord" id="pvChord">G</span><span class="pv-shape" id="pvShape"></span><div class="pv-diag" id="pvDiag"></div></div>
    <div class="pv-next"><span class="pv-label">Next</span><span class="pv-nchord" id="pvNext"></span><span class="pv-in" id="pvIn"></span><div class="pv-ndiag" id="pvNDiag"></div></div>
  </div>
  <div class="pv-strum" id="pvStrum"></div>
  <div class="pv-bars" id="pvBars"></div>
  <div class="pv-ctrl">
    <div class="bpm"><button id="pvDown" aria-label="Slower">−</button><output><span id="pvBpm">80</span> bpm</output><button id="pvUp" aria-label="Faster">+</button></div>
    <button class="pv-play" id="pvPlay" aria-label="Play">▶</button>
    <select id="pvLoop" aria-label="What to play"></select>
  </div>
</div>
<div class="tv" id="tv" hidden role="dialog" aria-label="TV mode">
  <div class="tv-top"><div class="tv-title"><b id="tvSong"></b><span id="tvArtist"></span></div>
    <div class="tv-secbox"><span id="tvSec"></span><span id="tvBar"></span></div>
    <button class="tv-btn" data-themebtn>Theme: Auto</button><button class="tv-btn" id="tvFull">⛶ Full screen</button><button class="tv-btn" id="tvExit">✕ Exit</button></div>
  <div class="tv-main">
    <div class="tv-hwy" id="tvHwy"><div id="tvTrack"></div><div class="tv-hit" id="tvHit"></div><div class="tv-count" id="tvCount" hidden>1</div><div class="tv-prog"><i id="tvProg"></i></div></div>
    <div class="tv-side">
      <div class="tv-now"><span class="tv-lab">Now</span><span id="tvNow">G</span><span id="tvShape"></span><div id="tvDiag"></div></div>
      <div class="tv-next"><span class="tv-lab">Next</span><span id="tvNext"></span><span id="tvIn"></span><div id="tvNDiag"></div></div>
    </div>
  </div>
  <div class="tv-bottom">
    <button class="tv-btn" id="tvPlay">▶ Play</button>
    <span class="tv-tempo"><button class="tv-btn" id="tvDown" aria-label="Slower">−</button><b><span id="tvBpm">80</span> bpm</b><button class="tv-btn" id="tvUp" aria-label="Faster">+</button></span>
    <select class="tv-btn" id="tvLoop" aria-label="What to play"></select>
    <span class="tv-keys">Space play · ← → tempo · ↑ ↓ section · F full screen · Esc exit</span>
  </div>
</div>
<script src="data/chords.js"></script>
<script src="data/songs.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/player.js"></script>
<script src="js/theme.js"></script>
<script src="js/play-view.js"></script>
<script src="js/tv-mode.js"></script>
<script src="js/hear-pattern.js"></script>
<script src="js/views.js"></script>
<script src="js/chord-changes.js"></script>
<script src="js/arcade.js"></script>
<script src="js/tuner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
